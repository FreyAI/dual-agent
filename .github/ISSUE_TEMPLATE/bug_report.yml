name: Bug report
description: Something in Dual Agent doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, do not open an issue — see [SECURITY.md](https://github.com/FreyAI/dual-agent/blob/main/SECURITY.md).
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: From the Extensions view, or `code --list-extensions --show-versions`.
      placeholder: 0.9.0
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help > About.
      placeholder: 1.95.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 (arm64) / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: The `dualAgent.mode` setting when the problem happened.
      options:
        - auto
        - claude
        - deepseek
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Output from the "Dual Agent" output channel and Help > Toggle Developer Tools > Console.
        Redact API keys, tokens and personal data — never paste them here.
      render: shell
    validations:
      required: false
