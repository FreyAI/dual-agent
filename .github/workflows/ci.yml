name: CI

on:
  push:
    branches: [main, public]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (lint)
        run: npx tsc --noEmit
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run test:webview
      # The VS Code test window needs a display; run offscreen.
      - name: VS Code integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: VS Code integration tests
        if: runner.os != 'Linux'
        run: npm run test:vscode

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The CLI image, not gitleaks-action: the action needs a license key on organization repos.
      # Fake tokens in test fixtures carry inline `gitleaks:allow` comments.
      - name: gitleaks
        run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1
